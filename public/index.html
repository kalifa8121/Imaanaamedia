<!DOCTYPE html>
<html lang="om" class="h-full bg-slate-100">
<head>
  <meta charset="UTF-8">
  <title>SuperApp - Admin & Customer Dashboards</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="h-full flex flex-col justify-center items-center bg-slate-900 text-slate-100 p-4">

  <!-- PORTAL SELECTION / LOGIN CONTAINER -->
  <div id="portalSelector" class="max-w-md w-full bg-slate-800 p-8 rounded-3xl shadow-2xl border border-slate-700 space-y-6">
    <div class="text-center">
      <h1 class="text-3xl font-black text-blue-400">SuperApp Portal</h1>
      <p class="text-xs text-slate-400 mt-1">Bakka itti seentan filadhaa</p>
    </div>

    <div class="space-y-3">
      <button onclick="showCustomerAuth()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition shadow">
        Customer Dashboard (Maammila)
      </button>
      <button onclick="showAdminAuth()" class="w-full bg-amber-600 hover:bg-amber-700 text-slate-900 font-bold py-3 rounded-xl transition shadow">
        Admin Dashboard (Bulchaa)
      </button>
    </div>
  </div>

  <!-- CUSTOMER LOGIN / SIGNUP MODAL -->
  <div id="customerAuthBox" class="hidden max-w-md w-full bg-slate-800 p-8 rounded-3xl shadow-2xl border border-slate-700 space-y-5">
    <div class="flex justify-between items-center">
      <h2 class="text-xl font-bold text-blue-400">Customer Portal</h2>
      <button onclick="backToPortal()" class="text-xs text-slate-400 hover:text-white">Deebi'i</button>
    </div>
    
    <div class="flex bg-slate-900 p-1 rounded-xl text-xs font-bold">
      <button onclick="setCustMode('login')" id="custTabLogin" class="flex-1 py-2 rounded-lg bg-blue-600 text-white">Login</button>
      <button onclick="setCustMode('signup')" id="custTabSignup" class="flex-1 py-2 rounded-lg text-slate-400">Signup</button>
    </div>

    <form onsubmit="handleCustomerAuth(event)" class="space-y-3">
      <div id="custSignupFields" class="hidden space-y-2">
        <input type="text" id="custRegName" placeholder="Maqaa Guutuu" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-xs text-white">
      </div>
      <input type="text" id="custUsername" placeholder="Username" required class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-xs text-white">
      <input type="password" id="custPassword" placeholder="Password" required class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-xs text-white">
      <button type="submit" id="custSubmitBtn" class="w-full bg-blue-600 py-3 rounded-xl font-bold text-sm text-white">Seeni (Login)</button>
    </form>
  </div>

  <!-- ADMIN LOGIN MODAL -->
  <div id="adminAuthBox" class="hidden max-w-md w-full bg-slate-800 p-8 rounded-3xl shadow-2xl border border-amber-500/30 space-y-5">
    <div class="flex justify-between items-center">
      <h2 class="text-xl font-bold text-amber-400">Admin Control Portal</h2>
      <button onclick="backToPortal()" class="text-xs text-slate-400 hover:text-white">Deebi'i</button>
    </div>

    <form onsubmit="handleAdminLogin(event)" class="space-y-3">
      <input type="text" id="adminUsername" placeholder="Admin Username (e.g. admin)" required class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-xs text-white">
      <input type="password" id="adminPassword" placeholder="Admin Password" required class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-xs text-white">
      <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 py-3 rounded-xl font-bold text-sm text-slate-900">Admin Login</button>
    </form>
  </div>

  <script>
    let mode = 'login';

    function showCustomerAuth() {
      document.getElementById('portalSelector').classList.add('hidden');
      document.getElementById('customerAuthBox').classList.remove('hidden');
    }

    function showAdminAuth() {
      document.getElementById('portalSelector').classList.add('hidden');
      document.getElementById('adminAuthBox').classList.remove('hidden');
    }

    function backToPortal() {
      document.getElementById('portalSelector').classList.remove('hidden');
      document.getElementById('customerAuthBox').classList.add('hidden');
      document.getElementById('adminAuthBox').classList.add('hidden');
    }

    function setCustMode(m) {
      mode = m;
      const isSignup = m === 'signup';
      document.getElementById('custSignupFields').classList.toggle('hidden', !isSignup);
      document.getElementById('custTabLogin').className = !isSignup ? 'flex-1 py-2 rounded-lg bg-blue-600 text-white' : 'flex-1 py-2 rounded-lg text-slate-400';
      document.getElementById('custTabSignup').className = isSignup ? 'flex-1 py-2 rounded-lg bg-blue-600 text-white' : 'flex-1 py-2 rounded-lg text-slate-400';
      document.getElementById('custSubmitBtn').innerText = isSignup ? "Galmaa'i (Signup)" : "Seeni (Login)";
    }

    function handleCustomerAuth(e) {
      e.preventDefault();
      alert("Customer Authentication Successful! Redirecting to Customer Dashboard...");
    }

    function handleAdminLogin(e) {
      e.preventDefault();
      const user = document.getElementById('adminUsername').value;
      if(user === 'admin') {
        alert("Admin Login Successful! Redirecting to Admin Control Center...");
      } else {
        alert("Admin username dogoggora!");
      }
    }
  </script>
</body>
</html>
